name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: 安装 pnpm
        run: npm install -g pnpm@11
      - name: 安装依赖
        run: pnpm install
      - name: 构建（含 vue-tsc 类型检查）
        run: pnpm build
